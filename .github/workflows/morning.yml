# PSX chat, step 6 (11 Nov 2026): the morning note on his phone before the market opens (toolkit/morning.py in the
# private tracker). Code finds what changed in his holdings and watchlists; free Gemini, then Groq, writes it in a few
# plain lines; nothing changed means nothing is sent. 12 Nov 2026: his watchlist (the 40 lowest expected P/E) is
# rebuilt first, so the note covers today's members. No Claude. Weekdays 8:17 am Pakistan time (3:17 UTC).
name: Morning note
on:
  schedule:
    - cron: '17 3 * * 1-5'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: morning
  cancel-in-progress: false
jobs:
  note:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: TQH1122/psx-tracker
          ref: main
          token: ${{ secrets.TRACKER_TOKEN }}
          persist-credentials: true
      - name: Rebuild his watchlist (the 40 lowest expected P/E, toolkit/autowatch.py)
        run: python3 toolkit/autowatch.py | tail -n 1 || true
      - name: Write and send the note
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python3 toolkit/morning.py 2> /tmp/morning_err.log | tail -n 1; tail -n 10 /tmp/morning_err.log || true
      - name: Save this morning's copy
        if: always()
        run: |
          git config user.name "psx-robot"; git config user.email "robot@users.noreply.github.com"
          python3 toolkit/savegit.py "Robot: morning note $(TZ=Asia/Karachi date '+%d %b %Y %H:%M') [CF-Pages-Skip]" data/files/morning/last.json data/files/morning/note.json data/db/watchlists/auto_lowpe.json
