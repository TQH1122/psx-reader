# PSX report reader: free AI models read listed companies' public annual reports, around the clock.
# Public repository, so GitHub's robot minutes are free and unlimited. Keys live in Settings, Secrets (never in files).
name: Report reader
on:
  schedule:
    - cron: '*/20 * * * *'    # backup timer only (GitHub had not fired it once on 1 Nov 2026); each run starts the next
  workflow_dispatch:
  push:
    paths: ['.github/run-now']
permissions:
  contents: write
  actions: write   # lets a productive run start the next one at once
concurrency:
  group: reader
  cancel-in-progress: false
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 120   # room for a 75 minute read plus the longest rest before the next run
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: command -v pdftotext && command -v tesseract || { sudo apt-get update -q || true; sudo apt-get install -y -q poppler-utils tesseract-ocr; }
      - name: Read annual reports
        timeout-minutes: 75          # a stuck step is stopped so the save and restart steps still run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_AI_TOKEN: ${{ secrets.CF_AI_TOKEN }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}   # reads the audit's re-read list from his locked tracker site
          OPENROUTER_PAID: '1'          # his prepaid $10 (1 Nov 2026): paid models first, free ones as extra checkers
          OPENROUTER_RESERVE: '0.5'     # paid models stop when $0.50 is left
        run: |
          if [ "$(head -n1 .github/run-now)" = diag ] && [ "${{ github.event_name }}" = push ]; then python3 toolkit/diag.py; exit 0; fi
          m=50; [ "$(head -n1 .github/run-now)" = short ] && [ "${{ github.event_name }}" = push ] && m=8
          python3 toolkit/annual.py --minutes $m --workers 18 | tee -a data/files/annual/log.txt
      - name: Wake the tracker robots if anything is overdue
        # GitHub drops or delays timed runs, so after every read the reader asks his site's /api/wake, which starts
        # the private robots when a regular job (prices, imports, weekly, monthly) is overdue. Never stops the reader.
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: |
          [ -n "$SITE_PASSWORD" ] || { echo "no SITE_PASSWORD"; exit 0; }
          c=$(printf 'psx-tracker:%s' "$SITE_PASSWORD" | sha256sum | cut -d' ' -f1)
          a=$(curl -s -m 60 -H "Cookie: psx_auth=$c" https://psx-tracker.pages.dev/api/wake || echo "{\"error\":\"no answer\"}")
          echo "$a"; mkdir -p data/files/annual; echo "$(date -u +%FT%TZ) $a" > data/files/annual/wake.txt   # the health check reads it
      - name: Start the tracker's free lane robots
        # the tracker's daily, import, weekly and monthly jobs run in this public repository's free minutes
        # (lane-daily.yml, lane-jobs.yml, 2 Nov 2026); each lane runs only what is due, so starting them every
        # half hour costs nothing and never waits on GitHub's unreliable timers
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for w in lane-daily.yml lane-jobs.yml broker.yml; do   # broker added 3 Nov 2026: its own timer kept being skipped
            busy=$(gh run list -w "$w" -L 5 --json status --jq '[.[]|select(.status!="completed")]|length' 2>/dev/null || echo 0)
            [ "${busy:-0}" = 0 ] && gh workflow run "$w" --ref main && echo "started $w" || echo "$w busy or not started"
          done
      - name: Save
        if: always()
        run: |
          git config user.name "psx-robot"; git config user.email "robot@users.noreply.github.com"
          tail -n 300 data/files/annual/log.txt > l && mv l data/files/annual/log.txt
          git add data
          git diff --cached --quiet && { echo "nothing changed"; exit 0; }
          git commit -q -m "Reader: $(TZ=Asia/Karachi date '+%d %b %Y %H:%M')"
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && exit 0; sleep $((i*10)); done
          exit 1
      - name: Start the next run (24/7)
        # always starts the next run unless someone cancelled this one; after a run that read nothing or broke it waits
        # 5 minutes first so a fault cannot loop fast, and with everything read it checks every 30 minutes
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last="$(grep 'done: read' data/files/annual/log.txt | tail -n 1)"
          if echo "$last" | grep -q "about 0 still to read"; then
            # all read: never stop for good. New reports are filed every season, and each run also wakes the
            # tracker robots, so the chain keeps going, checking every 30 minutes (free in this public repository)
            sleep 1800
          else
            if [ "${{ job.status }}" != success ] || ! echo "$last" | grep -qE "done: read [1-9]"; then sleep 300; fi
            # idle guard: three empty runs in a row means only unreadable reports are left, so rest 20 minutes more
            if [ "$(grep 'done: read' data/files/annual/log.txt | tail -n 3 | grep -c 'done: read 0 ')" = 3 ]; then sleep 1200; fi
          fi
          for i in 1 2 3; do gh workflow run reader.yml --ref main && exit 0; sleep 30; done
