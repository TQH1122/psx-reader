# PSX report reader: free AI models read listed companies' public annual reports, around the clock.
# Public repository, so GitHub's robot minutes are free and unlimited. Keys live in Settings, Secrets (never in files).
name: Report reader
on:
  schedule:
    - cron: '*/20 * * * *'    # backup timer only (GitHub had not fired it once on 1 Nov 2026); each run starts the next
  workflow_dispatch:
  push:
    paths: ['.github/run-now']
permissions:
  contents: write
  actions: write   # lets a productive run start the next one at once
concurrency:
  group: reader
  cancel-in-progress: false
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: command -v pdftotext && command -v tesseract || { sudo apt-get update -q || true; sudo apt-get install -y -q poppler-utils tesseract-ocr; }
      - name: Read annual reports
        timeout-minutes: 75          # a stuck step is stopped so the save and restart steps still run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_AI_TOKEN: ${{ secrets.CF_AI_TOKEN }}
          OPENROUTER_PAID: '1'          # his prepaid $10 (1 Nov 2026): paid models first, free ones as extra checkers
          OPENROUTER_RESERVE: '0.5'     # paid models stop when $0.50 is left
        run: |
          if [ "$(head -n1 .github/run-now)" = diag ] && [ "${{ github.event_name }}" = push ]; then python3 toolkit/diag.py; exit 0; fi
          m=50; [ "$(head -n1 .github/run-now)" = short ] && [ "${{ github.event_name }}" = push ] && m=8
          python3 toolkit/annual.py --minutes $m --workers 18 | tee -a data/files/annual/log.txt
      - name: Save
        if: always()
        run: |
          git config user.name "psx-robot"; git config user.email "robot@users.noreply.github.com"
          tail -n 300 data/files/annual/log.txt > l && mv l data/files/annual/log.txt
          git add data
          git diff --cached --quiet && { echo "nothing changed"; exit 0; }
          git commit -q -m "Reader: $(TZ=Asia/Karachi date '+%d %b %Y %H:%M')"
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && exit 0; sleep $((i*10)); done
          exit 1
      - name: Start the next run (24/7)
        # always starts the next run unless someone cancelled this one or nothing is left to read; after a run that read
        # nothing or broke, it waits 5 minutes first so a fault cannot loop fast
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last="$(grep 'done: read' data/files/annual/log.txt | tail -n 1)"
          if echo "$last" | grep -q "about 0 still to read"; then echo "all read"; exit 0; fi
          if [ "${{ job.status }}" != success ] || ! echo "$last" | grep -qE "done: read [1-9]"; then sleep 300; fi
          for i in 1 2 3; do gh workflow run reader.yml --ref main && exit 0; sleep 30; done
