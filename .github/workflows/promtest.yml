# One off check of the promise tracker's model answers (11 Nov 2026); started by hand only.
name: Promise tracker check
on:
  workflow_dispatch:
permissions:
  contents: read
  models: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: TQH1122/psx-tracker
          ref: main
          token: ${{ secrets.TRACKER_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_AI_TOKEN: ${{ secrets.CF_AI_TOKEN }}
        run: |
          python3 -c "import json;p='data/files/promises/state.json';s=json.load(open(p));s['read'].pop('d305e1242584',None);json.dump(s,open(p,'w'))"
          timeout 600 python3 toolkit/promises.py --minutes 4 --debug 2>&1 | grep -E "debug|done:|Error|Traceback" | cut -c1-900 | head -20
