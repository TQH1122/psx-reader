# One off check (12 Nov 2026): does the briefing reader's own Gemini key work? Prints only yes or no.
name: Briefing key check
on:
  push:
    paths: ['.github/run-keytest']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          K: ${{ secrets.GEMINI_CBS_KEY }}
          OLD: ${{ secrets.GEMINI_API_KEY }}
        run: |
          [ -n "$K" ] || { echo "RESULT: key missing"; exit 0; }
          [ "$K" = "$OLD" ] && echo "RESULT: same key as the other robots (needs a NEW project)"
          code=$(curl -s -o /tmp/r.json -w '%{http_code}' "https://generativelanguage.googleapis.com/v1beta/models?key=$K")
          n=$(python3 -c "import json;print(len([m for m in json.load(open('/tmp/r.json')).get('models',[]) if 'flash' in m['name']]))" 2>/dev/null || echo 0)
          echo "RESULT: key answered $code, $n Flash models available"
